services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "1234:5432"
    volumes:
      - oink:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: "5s"
      timeout: "3s"
      retries: 5
volumes:
  oink: